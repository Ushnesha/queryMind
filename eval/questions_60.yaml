- id: M4-H2
  set: hard
  kind: reference
  ordered: true
  question: What is the running total of revenue by month during 2024?
  reference_sql: |
    WITH monthly AS (
      SELECT strftime('%Y-%m', order_date) AS month, SUM(total_amount) AS revenue
      FROM orders
      WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01'
      GROUP BY strftime('%Y-%m', order_date)
    )
    SELECT month, SUM(revenue) OVER (ORDER BY month) AS running_revenue
    FROM monthly
    ORDER BY month
  note: >
    Every month of 2024 has orders, so there are 12 rows. The running total is a
    float sum; the scorer's 1e-6 rounding absorbs summation-order differences.

- id: M4-H3
  set: hard
  kind: reference
  ordered: false
  question: How much revenue came from orders placed before the customer signed up?
  reference_sql: |
    SELECT SUM(o.total_amount) AS revenue_before_signup
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_date < c.signup_date
  note: >
    The seeded data has orders dated before the customer's signup_date (a data
    quirk, not an error in the question). The answer is one non-zero number.

