- id: M1-E1
  set: easy
  kind: reference
  ordered: false
  question: How many orders were placed in each region?
  reference_sql: |
    SELECT c.region, COUNT(*) AS order_count
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    GROUP BY c.region

- id: M1-E2
  set: easy
  kind: reference
  ordered: false
  question: What is the most expensive product?
  reference_sql: |
    SELECT product_name, unit_price
    FROM products
    ORDER BY unit_price DESC
    LIMIT 1

- id: M1-H1
  set: hard
  kind: reference
  ordered: false
  question: For each region, which customer spent the most?
  reference_sql: |
    WITH spend AS (
      SELECT c.region, c.customer_name, SUM(o.total_amount) AS total_spent
      FROM customers c
      JOIN orders o ON o.customer_id = c.customer_id
      GROUP BY c.customer_id, c.region, c.customer_name
    ), ranked AS (
      SELECT region, customer_name, total_spent,
             RANK() OVER (PARTITION BY region ORDER BY total_spent DESC) AS rk
      FROM spend
    )
    SELECT region, customer_name
    FROM ranked
    WHERE rk = 1

- id: M1-H2
  set: hard
  kind: reference
  ordered: false
  question: Which products had no orders in December 2024?
  reference_sql: |
    SELECT p.product_name
    FROM products p
    WHERE NOT EXISTS (
      SELECT 1 FROM orders o
      WHERE o.product_id = p.product_id
        AND o.order_date >= '2024-12-01' AND o.order_date < '2025-01-01'
    )

- id: M1-H3
  set: hard
  kind: reference
  ordered: false
  question: Which customers spent more than the average total spending per customer?
  reference_sql: |
    WITH totals AS (
      SELECT customer_id, SUM(total_amount) AS total_spent
      FROM orders
      GROUP BY customer_id
    )
    SELECT c.customer_name
    FROM totals t
    JOIN customers c ON c.customer_id = t.customer_id
    WHERE t.total_spent > (SELECT AVG(total_spent) FROM totals)
  note: >
    Every customer has at least one order, so "average per customer" is the same
    whether or not customers without orders are counted.

- id: M1-U1
  set: unanswerable
  kind: unanswerable
  question: How much revenue came from orders paid by credit card?
  missing_field: payment method
  accept_missing: [payment, card, method, tender, transaction type]

- id: M1-U2
