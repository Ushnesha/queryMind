# Member 4 contribution to the 60-question set.
# Mix: 2 easy, 3 hard, 2 unanswerable, 1 ambiguous.
# Same schema and field rules as external/agentic-sql-analyst/eval/questions.yaml.
# Every reference_sql was run against data/stakeholder_analytics.db and checked
# for ties and empty results. The file loads with the stakeholder's dataset.load_questions.

- id: M4-E1
  set: easy
  kind: reference
  ordered: false
  question: How many customers are there in each region?
  reference_sql: |
    SELECT region, COUNT(*) AS customer_count
    FROM customers
    GROUP BY region

- id: M4-E2
  set: easy
  kind: reference
  ordered: false
  question: What was the total revenue in March 2024?
  reference_sql: |
    SELECT SUM(total_amount) AS march_revenue
    FROM orders
    WHERE order_date >= '2024-03-01' AND order_date < '2024-04-01'

- id: M4-H1
  set: hard
  kind: reference
  ordered: false
  question: Which customer spent the most in each product category?
  reference_sql: |
    WITH spend AS (
      SELECT p.category, c.customer_name, SUM(o.total_amount) AS total_spent
      FROM orders o
      JOIN customers c ON c.customer_id = o.customer_id
      JOIN products p ON p.product_id = o.product_id
      GROUP BY p.category, c.customer_id, c.customer_name
    ), ranked AS (
      SELECT category, customer_name,
             RANK() OVER (PARTITION BY category ORDER BY total_spent DESC) AS rk
      FROM spend
    )
    SELECT category, customer_name
    FROM ranked
    WHERE rk = 1
  note: >
    Checked for ties: each category has a single top customer (the runner-up is
    at least 189 behind), so RANK and ROW_NUMBER give the same 3 rows.

- id: M4-H2
  set: hard
  kind: reference
  ordered: true
  question: What is the running total of revenue by month during 2024?
  reference_sql: |
    WITH monthly AS (
      SELECT strftime('%Y-%m', order_date) AS month, SUM(total_amount) AS revenue
      FROM orders
      WHERE order_date >= '2024-01-01' AND order_date < '2025-01-01'
      GROUP BY strftime('%Y-%m', order_date)
    )
    SELECT month, SUM(revenue) OVER (ORDER BY month) AS running_revenue
    FROM monthly
    ORDER BY month
  note: >
    Every month of 2024 has orders, so there are 12 rows. The running total is a
    float sum; the scorer's 1e-6 rounding absorbs summation-order differences.

- id: M4-H3
  set: hard
  kind: reference
  ordered: false
  question: How much revenue came from orders placed before the customer signed up?
  reference_sql: |
    SELECT SUM(o.total_amount) AS revenue_before_signup
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_date < c.signup_date
  note: >
    The seeded data has orders dated before the customer's signup_date (a data
    quirk, not an error in the question). The answer is one non-zero number.

- id: M4-U1
  set: unanswerable
  kind: unanswerable
  question: What is the average shipping cost per order?
  missing_field: shipping cost
  accept_missing: [shipping, freight, carrier, postage, delivery cost]

- id: M4-U2
  set: unanswerable
  kind: unanswerable
  question: What discount was applied to each order?
  missing_field: discount or promotion data
  accept_missing: [discount, coupon, promo, markdown, rebate]

- id: M4-A1
  set: ambiguous
  kind: ambiguous
  question: Which region is our biggest?
  undefined_terms: ["size measure (revenue vs order count vs customer count)"]
  note: >
    Revenue, orders and customers rank the regions differently (West leads on
    revenue and customers, East ties West on orders), so one silent choice can
    be wrong. Correct behaviour is to answer AND state the measure used.
