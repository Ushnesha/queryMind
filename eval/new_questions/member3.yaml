# Member 3 contribution to the 60-question set (R4).
# Mix: 2 easy, 3 hard, 2 unanswerable, 1 ambiguous.
# Same schema and field rules as external/agentic-sql-analyst/eval/questions.yaml
# (customers 20 rows / 4 regions, products 15 rows / 3 categories, orders 300 rows, all in 2024).
# reference_sql is checked to run and return rows by tests/test_member3_questions.py
# once data/stakeholder_analytics.db is seeded (`make stakeholder-baseline`).

- id: M3-E1
  set: easy
  kind: reference
  ordered: false
  question: How many customers are there in each region?
  reference_sql: |
    SELECT region, COUNT(*) AS customer_count
    FROM customers
    GROUP BY region

- id: M3-E2
  set: easy
  kind: reference
  ordered: false
  question: How many units were sold in total across all orders?
  reference_sql: |
    SELECT SUM(quantity) AS units_sold
    FROM orders

- id: M3-H1
  set: hard
  kind: reference
  ordered: false
  question: What is the average number of orders per customer in each region?
  reference_sql: |
    SELECT c.region,
           1.0 * COUNT(o.order_id) / COUNT(DISTINCT c.customer_id) AS orders_per_customer
    FROM customers c
    LEFT JOIN orders o ON o.customer_id = c.customer_id
    GROUP BY c.region
  note: >
    Customers with no orders count in the denominator (LEFT JOIN). With 300 orders
    over 20 customers every customer has orders, so an INNER JOIN gives the same rows.

- id: M3-H2
  set: hard
  kind: reference
  ordered: false
  question: For each product category, what percentage of its units were sold in the second half of 2024?
  reference_sql: |
    SELECT p.category,
           100.0 * SUM(CASE WHEN o.order_date >= '2024-07-01' THEN o.quantity ELSE 0 END)
                 / SUM(o.quantity) AS pct_units_second_half
    FROM orders o
    JOIN products p ON p.product_id = o.product_id
    GROUP BY p.category
  note: >
    Second half = July 1 to December 31, 2024 (all orders are in 2024). Left unrounded
    so the 1e-6 float tolerance applies; a fraction (0-1) is the same share on a
    different scale.

- id: M3-H3
  set: hard
  kind: reference
  ordered: false
  question: Which customers placed more orders than the average customer in their region?
  reference_sql: |
    WITH per_customer AS (
      SELECT c.customer_id, c.customer_name, c.region, COUNT(o.order_id) AS order_count
      FROM customers c
      LEFT JOIN orders o ON o.customer_id = c.customer_id
      GROUP BY c.customer_id, c.customer_name, c.region
    )
    SELECT customer_name
    FROM per_customer pc
    WHERE order_count > (SELECT AVG(order_count) FROM per_customer r WHERE r.region = pc.region)
  note: >
    The average is per region (correlated comparison), not the overall average.
    Customer names are unique in this database.

- id: M3-U1
  set: unanswerable
  kind: unanswerable
  question: What was the total shipping cost for orders in each region?
  missing_field: shipping cost
  accept_missing: [shipping, freight, delivery cost, postage]

- id: M3-U2
  set: unanswerable
  kind: unanswerable
  question: Which discount codes were used most often last year?
  missing_field: discount or promotion codes
  accept_missing: [discount, coupon, promo, promotion, voucher]

- id: M3-A1
  set: ambiguous
  kind: ambiguous
  question: Show me our big orders.
  undefined_terms: ["what makes an order big (total_amount vs quantity)", "the cutoff (fixed threshold vs top N vs above average)"]
