# DRAFT - Member 5's questions converted to the stakeholder schema and format.
# PENDING MEMBER 5 APPROVAL. Source: eval/new_questions/member5.yaml (unchanged).
#
# Why a conversion was needed: member5.yaml targets the QueryMind demo schema
# (customers.name, customers.email, orders.amount) in a different YAML format, so
# the stakeholder loader rejects it and its SQL fails on data/stakeholder_analytics.db.
#
# What changed per question (wording kept unless noted):
#   M5_E1 -> M5-E1   amount -> total_amount.
#   M5_E2 -> M5-U2   The stakeholder schema has no email column, so this is now an
#                    unanswerable question (missing field: email). Wording unchanged.
#   M5_H1 -> M5-H1   name -> customer_name, amount -> total_amount.
#                    FLAG for Member 5: every one of the 20 customers has more than two
#                    orders (7 to 22 each), so the answer is "all customers". Consider a
#                    higher threshold (e.g. more than 15 orders).
#   M5_H2 -> M5-H2   Columns renamed. FLAG for Member 5: every order is dated 2024, so
#                    the year filter does not change the answer.
#   M5_H3            Dropped: duplicates M1-H3 (customers above average spending).
#   M5_U1 -> M5-U1   Format only.
#   M5_A1 -> M5-A1   The reference assumption becomes undefined terms, because the
#                    stakeholder scorer credits ambiguous questions for stating an
#                    assumption, not for matching one interpretation.
# Every reference_sql was run against data/stakeholder_analytics.db and returns rows.

- id: M5-E1
  set: easy
  kind: reference
  ordered: false
  question: What is the highest order amount recorded?
  reference_sql: |
    SELECT MAX(total_amount) AS max_amount
    FROM orders

- id: M5-H1
  set: hard
  kind: reference
  ordered: false
  question: Which customers have placed more than two orders, and what is their total spending?
  reference_sql: |
    SELECT c.customer_name, COUNT(o.order_id) AS order_count, SUM(o.total_amount) AS total_spending
    FROM customers AS c
    JOIN orders AS o ON c.customer_id = o.customer_id
    GROUP BY c.customer_id, c.customer_name
    HAVING COUNT(o.order_id) > 2
  note: >
    Pending Member 5: all 20 customers qualify, so the threshold does not filter.

- id: M5-H2
  set: hard
  kind: reference
  ordered: false
  question: What is the average order amount per customer for orders placed in 2024?
  reference_sql: |
    SELECT c.customer_name, AVG(o.total_amount) AS avg_order_amount
    FROM customers AS c
    JOIN orders AS o ON c.customer_id = o.customer_id
    WHERE o.order_date >= '2024-01-01' AND o.order_date < '2025-01-01'
    GROUP BY c.customer_id, c.customer_name
  note: >
    Pending Member 5: all orders are in 2024, so the date filter is a no-op.
    Float averages; the scorer's 1e-6 tolerance applies.

- id: M5-U1
  set: unanswerable
  kind: unanswerable
  question: What is the shipping address for customer Alice?
  missing_field: shipping address
  accept_missing: [address, shipping address, street, postal]

- id: M5-U2
  set: unanswerable
  kind: unanswerable
  question: Which customers have an email address on file?
  missing_field: email address
  accept_missing: [email, e-mail, contact]
  note: >
    Was M5_E2 (easy, answerable) on the demo schema, which has customers.email.
    The stakeholder schema has no contact fields.

- id: M5-A1
  set: ambiguous
  kind: ambiguous
  question: Who are the recent customers?
  undefined_terms: ["what makes a customer recent (recent signup vs recent order)", "the time window for 'recent'"]
  note: >
    Member 5's intended reading was "placed an order on or after 2024-01-01", which
    is every customer here because all orders are in 2024.
