- id: S0210
  set: multi
  kind: reference
  ordered: false
  question: Return the number of flights arriving in Aberdeen.
  reference_sql: 'SELECT count(*) FROM FLIGHTS AS T1 JOIN AIRPORTS AS T2 ON T1.DestAirport  =  T2.AirportCode
    WHERE T2.City  =  "Aberdeen"

    '
  note: Spider 1.0 dev.json index 210; db_id flight_2
- id: S0211
  set: multi
  kind: reference
  ordered: false
  question: How many flights depart from City 'Aberdeen' and have destination City 'Ashley'?
  reference_sql: 'SELECT count(*) FROM FLIGHTS AS T1 JOIN AIRPORTS AS T2 ON T1.DestAirport  =  T2.AirportCode
    JOIN AIRPORTS AS T3 ON T1.SourceAirport  =  T3.AirportCode WHERE T2.City  =  "Ashley" AND T3.City  =  "Aberdeen"

    '
  note: Spider 1.0 dev.json index 211; db_id flight_2
