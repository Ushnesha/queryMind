- id: S0231
  set: multi
  kind: reference
  ordered: true
  question: Find the abbreviation and country of the airline that has fewest number of flights?
  reference_sql: 'SELECT T1.Abbreviation ,  T1.Country FROM AIRLINES AS T1 JOIN FLIGHTS AS T2 ON T1.uid  =  T2.Airline
    GROUP BY T1.Airline ORDER BY count(*) LIMIT 1

    '
  note: Spider 1.0 dev.json index 231; db_id flight_2
