- id: S0636
  set: multi
  kind: reference
  ordered: false
  question: What are the countries that are not playing cartoons written by Todd Casey?
  reference_sql: 'SELECT country FROM TV_Channel EXCEPT SELECT T1.country FROM TV_Channel AS T1 JOIN cartoon
    AS T2 ON T1.id = T2.Channel WHERE T2.written_by  =  ''Todd Casey''

    '
  note: Spider 1.0 dev.json index 636; db_id tvshow
