  question: Find the id and cell phone of the professionals who operate two or more types of treatments.
  reference_sql: 'SELECT T1.professional_id ,  T1.cell_number FROM Professionals AS T1 JOIN Treatments
    AS T2 ON T1.professional_id  =  T2.professional_id GROUP BY T1.professional_id HAVING count(*)  >=  2

    '
