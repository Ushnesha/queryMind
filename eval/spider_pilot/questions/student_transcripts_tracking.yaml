- id: S0537
  set: multi
  kind: reference
  ordered: true
  question: Find the kind of program which most number of students are enrolled in?
  reference_sql: 'SELECT T1.degree_summary_name FROM Degree_Programs AS T1 JOIN Student_Enrolment AS T2
    ON T1.degree_program_id  =  T2.degree_program_id GROUP BY T1.degree_summary_name ORDER BY count(*)
    DESC LIMIT 1

    '
