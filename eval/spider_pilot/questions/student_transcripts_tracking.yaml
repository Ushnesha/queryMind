- id: S0561
  set: multi
  kind: reference
  ordered: true
  question: Which address holds the most number of students currently? List the address id and all lines.
  reference_sql: 'SELECT T1.address_id ,  T1.line_1 ,  T1.line_2 FROM Addresses AS T1 JOIN Students AS
    T2 ON T1.address_id  =  T2.current_address_id GROUP BY T1.address_id ORDER BY count(*) DESC LIMIT
    1

    '
